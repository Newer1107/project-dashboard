name: Deploy Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      # Skip the 2 GB default heap: `next build` type-checking peaks above it
      # on this host and the build dies with a V8 OOM, leaving .next half-written.
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Deploy application
        run: |
          cd /home/tcetcercd/project-dashboard
          git pull origin main
          npm install --legacy-peer-deps
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          pm2 restart dashboard
